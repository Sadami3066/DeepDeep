name: Bug report
description: 报告可复现的问题（请先搜现有 issue）
title: "[bug] "
labels: ["type:bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请确认：已阅读 README/AGENTS.md，且问题可以在当前 `master` 或最新 Release 上复现。
        安全漏洞请勿在此提交，见 SECURITY.md。
  - type: input
    id: version
    attributes:
      label: 版本
      description: Release tag、commit sha 或「本地构建」
      placeholder: "m2 之后的 commit / v0.2.0 / 本地 debug"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统
      placeholder: "Redmi 22101316UCP / Android 13 / arm64-v8a"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 前置状态（数据/权限/网络）+ 操作 + 看到什么
      placeholder: |
        1. 配置 X provider
        2. 打开 Y 页面
        3. 看到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为（含日志/截图）
      description: |
        日志：`adb logcat -s DeepDeepRuntime` 或 App 内错误行
        截图：请脱敏（会话内容/账号）
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: 数据影响
      description: 是否丢数据/写坏文件/错误投递提醒；以及是否可恢复
    validations:
      required: false
