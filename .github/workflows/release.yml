name: Release

# 手动发布：先提交版本号并推送 tag，再用该 tag 触发。
# 需要的 Secrets：ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD。
# 更新说明必须手写在仓库文件里（默认 release-notes/<tag>.md），release body 会原样显示在 App 更新页。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（例如 v1.0.3，必须已存在且与 versionName 一致）
        required: true
      notes_file:
        description: 手写更新说明文件路径（相对仓库根，例如 release-notes/v1.0.3.md）
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify release inputs
        env:
          TAG_NAME: ${{ inputs.tag }}
          NOTES_FILE: ${{ inputs.notes_file }}
        run: |
          VERSION="${TAG_NAME#v}"
          grep -q "versionName = \"${VERSION}\"" app/build.gradle.kts
          test -s "$NOTES_FILE"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Ensure Android SDK 36
        run: |
          source scripts/env.sh
          deepdeep_ensure_sdk_components "$(deepdeep_android_sdk)"

      - name: Check
        run: ./scripts/check.sh --full

      - name: Stage signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build signed APK
        run: ./scripts/gradlew-locked :app:assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "DeepDeep-${VERSION}.apk"
          gh release create "${{ inputs.tag }}" "DeepDeep-${VERSION}.apk" \
            --title "${{ inputs.tag }}" --notes-file "${{ inputs.notes_file }}"
