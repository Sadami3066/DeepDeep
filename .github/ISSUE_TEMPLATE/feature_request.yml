name: Feature request
description: 提议新能力或改动现有行为
title: "[feat] "
labels: ["type:feature", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        先看 `docs/user/GUIDE.md` 的已知边界与 `docs/dev/adr/` 的既有决策；被 ADR 明确否决的方向请先讨论 ADR 的「推翻条件」。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的真实问题
      description: 描述场景与现状缺口，不要先写实现方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 接口/交互层面的设想；涉及权限、数据、后台执行的必须说明
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响面
      options:
        - 仅 UI/文案
        - 新增插件或工具
        - 影响持久化/schema
        - 影响后台服务/提醒/任务
        - 影响构建/发布
    validations:
      required: true
