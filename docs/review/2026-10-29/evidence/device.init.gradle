gradle.beforeProject { p ->
 if (p.path == ':app') {
  p.layout.buildDirectory.set(p.rootProject.layout.projectDirectory.dir('docs/review/2026-10-29/evidence/device-build'))
  p.pluginManager.withPlugin('com.android.application') {
   p.androidComponents.finalizeDsl { dsl ->
    dsl.defaultConfig.applicationId = 'io.github.whywood.deepdeep.audit20261029'
    dsl.defaultConfig.testApplicationId = 'io.github.whywood.deepdeep.audit20261029.test'
   }
  }
 }
}
